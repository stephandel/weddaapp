<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WeddaApp</title>
<meta name="theme-color" content="#086ADC">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WeddaApp">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="lib/leaflet/leaflet.css">
<link rel="stylesheet" href="meteogramm.css">
<link rel="stylesheet" href="wpkarte.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="kopf glas" id="kopf">
  <button type="button" class="kopf-knopf" id="kopfOrte" aria-label="Orte"></button>
  <h1 class="kopf-titel" id="kopfTitel">WeddaApp</h1>
  <button type="button" class="kopf-knopf" id="kopfSuche" aria-label="Ort suchen"></button>
  <button type="button" class="kopf-knopf" id="kopfTeilen" aria-label="Wetter mit Foto teilen"></button>
</header>

<div class="meldung" id="meldung" role="status" hidden></div>

<main id="inhalt">
  <section class="reiter" id="tab-wetter" aria-labelledby="kopfTitel"></section>
  <section class="reiter" id="tab-graphs" hidden></section>
  <section class="reiter" id="tab-radsat" hidden></section>
  <section class="reiter" id="tab-mehr" hidden></section>
</main>

<nav class="leiste glas" id="leiste" aria-label="Reiter"></nav>

<!-- Wetterfoto: Kamera-Studio aus lib/kamera-studio/, wird erst bei Bedarf geladen -->
<div class="studio" id="studio" role="dialog" aria-modal="true" aria-label="Wetterfoto" hidden>
  <div class="studio-kopf">
    <h2 class="studio-titel">Wetterfoto</h2>
    <button type="button" class="studio-zu" id="studioZu">Fertig</button>
  </div>
  <div class="studio-wurzel" id="ksWurzel"></div>
</div>

<script src="symbole.js"></script>
<script src="ikonen.js"></script>
<script src="lib/leaflet/leaflet.min.js"></script>
<script src="meteogramm.js"></script>
<script src="wpkarte.js"></script>
<script src="dwd.js"></script>
<script src="app.js"></script>
</body>
</html>
